version: '3.8'

services:
  toolbox:
    build:
      context: ./backend
      target: build
    profiles: ["tools"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/freelance_marketplace?schema=public
      QUEUE_DRIVER: memory
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-local-only-talentcloud-jwt-secret-change-before-deploy}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-only-talentcloud-cookie-secret-change-before-deploy}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    container_name: talentcloud-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/freelance_marketplace?schema=public
      QUEUE_DRIVER: bullmq
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-local-only-talentcloud-jwt-secret-change-before-deploy}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-only-talentcloud-cookie-secret-change-before-deploy}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    container_name: talentcloud-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/freelance_marketplace?schema=public
      QUEUE_DRIVER: bullmq
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-local-only-talentcloud-jwt-secret-change-before-deploy}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-only-talentcloud-cookie-secret-change-before-deploy}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: talentcloud-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: freelance_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freelance_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: marketplace-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:
