version: '3.8'

services:
  toolbox:
    build:
      context: ./backend
      target: build
    profiles: ["tools"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local-only-talentcloud-db-password}@postgres:5432/freelance_marketplace?schema=public
      QUEUE_DRIVER: memory
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-local-only-talentcloud-jwt-secret-change-before-deploy}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-only-talentcloud-cookie-secret-change-before-deploy}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    container_name: talentcloud-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local-only-talentcloud-db-password}@postgres:5432/freelance_marketplace?schema=public
      QUEUE_DRIVER: bullmq
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET_NAME: talentcloud-files
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-local-only-talentcloud-jwt-secret-change-before-deploy}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-only-talentcloud-cookie-secret-change-before-deploy}
    expose:
      - "5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    container_name: talentcloud-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-local-only-talentcloud-db-password}@postgres:5432/freelance_marketplace?schema=public
      QUEUE_DRIVER: bullmq
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET_NAME: talentcloud-files
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-local-only-talentcloud-jwt-secret-change-before-deploy}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-only-talentcloud-cookie-secret-change-before-deploy}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: talentcloud-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-talentcloud-db-password}
      POSTGRES_DB: freelance_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freelance_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: marketplace-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-talentcloud-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-talentcloud-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: talentcloud-minio-init
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing local/talentcloud-files
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-talentcloud-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-talentcloud-minio-password}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:
